name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate Release Notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # Prefer the CHANGELOG section for this tag: for a major release the migration
          # steps live there, and a list of commit subjects would omit them entirely.
          SECTION=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/      { exit }
            found                  { print }
          ' CHANGELOG.md)

          {
            echo "body<<__EOF__"
            if [ -n "$(printf '%s' "$SECTION" | tr -d '[:space:]')" ]; then
              printf '%s\n' "$SECTION"
            else
              echo "No CHANGELOG entry found for $VERSION; falling back to commit subjects."
              echo
              PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
              if [ -z "$PREV_TAG" ]; then
                echo "Initial release"
              else
                git log --pretty=format:"- %s" "$PREV_TAG"..HEAD
                echo
              fi
            fi
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true
