name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -recursive -check

  validate-root:
    # The attribute allowlists reference locals from a validation block, which needs >= 1.9, and
    # OpenTofu below 1.10.3 crashes in `tofu test` on this module (see CHANGELOG 3.0.0), which is
    # why the floor is a patch release. Test the declared floor as well as current releases, on
    # both engines.
    name: Validate Root (${{ matrix.engine }} ${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: terraform
            version: 1.10.3
          - engine: terraform
            version: latest
          - engine: opentofu
            version: 1.10.3
          - engine: opentofu
            version: latest
    steps:
      - uses: actions/checkout@v4
      - if: matrix.engine == 'terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.version }}
          terraform_wrapper: false
      - if: matrix.engine == 'opentofu'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ matrix.version }}
          tofu_wrapper: false
      - name: Validate
        run: |
          bin=$([ "${{ matrix.engine }}" = "opentofu" ] && echo tofu || echo terraform)
          "$bin" init -backend=false
          "$bin" validate

  validate-examples:
    name: Validate Examples
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [simple, complete, integrations, maintenance, private-locations]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - working-directory: examples/${{ matrix.example }}
        run: terraform init -backend=false
      - working-directory: examples/${{ matrix.example }}
        run: terraform validate

  validate-wrappers:
    name: Validate Wrappers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - working-directory: wrappers
        run: terraform init -backend=false
      - working-directory: wrappers
        run: terraform validate

  test:
    # terraform test with mock_provider — no credentials and no API calls. Run on both engines,
    # since the module's validation behaviour depends on features they implement separately, and
    # on the declared floor as well as latest: until 3.0.0 this job ran only on latest, which is
    # how an OpenTofu 1.9.0 crash in these suites went unnoticed while 1.9 was the floor.
    name: Test (${{ matrix.engine }} ${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: terraform
            version: 1.10.3
          - engine: terraform
            version: latest
          - engine: opentofu
            version: 1.10.3
          - engine: opentofu
            version: latest
    steps:
      - uses: actions/checkout@v4
      - if: matrix.engine == 'terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.version }}
          terraform_wrapper: false
      - if: matrix.engine == 'opentofu'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ matrix.version }}
          tofu_wrapper: false
      - name: Run tests
        run: |
          bin=$([ "${{ matrix.engine }}" = "opentofu" ] && echo tofu || echo terraform)
          status=0
          for dir in . modules/check modules/statuspage modules/integration wrappers; do
            echo "::group::$dir"
            ( cd "$dir" && "$bin" init -backend=false && "$bin" test ) || status=1
            echo "::endgroup::"
          done
          exit $status

  docs-drift:
    # The committed README tables are generated. Regenerate and fail if they differ, so they
    # cannot drift from the code the way they had before v2.0.0.
    #
    # Deliberately no `terraform init` here: with a lock file present terraform-docs renders the
    # resolved provider version instead of the constraint, which would change the output.
    name: Docs Drift
    runs-on: ubuntu-latest
    env:
      TERRAFORM_DOCS_VERSION: v0.24.0
    steps:
      - uses: actions/checkout@v4
      - name: Install terraform-docs
        run: |
          curl -sSLo /tmp/terraform-docs.tar.gz \
            "https://terraform-docs.io/dl/${TERRAFORM_DOCS_VERSION}/terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/terraform-docs.tar.gz -C /tmp terraform-docs
          install -m 0755 /tmp/terraform-docs /usr/local/bin/terraform-docs
          terraform-docs --version
      - name: Regenerate
        run: |
          for dir in . modules/*/ wrappers; do
            terraform-docs -c "$PWD/.terraform-docs.yml" "$dir"
          done
      - name: Fail if the committed docs differ
        run: |
          if ! git diff --exit-code -- '*README.md'; then
            echo "::error::README tables are out of date. Regenerate them (see CONTRIBUTING.md) and commit."
            exit 1
          fi

  allowlist-drift:
    # An allowlist that omits an attribute the module reads makes that attribute
    # unsettable. Fail if the two ever disagree.
    name: Allowlist Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare allowlists against attributes the module reads
        run: python3 scripts/check_allowlists.py
