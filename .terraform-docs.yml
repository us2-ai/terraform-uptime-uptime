formatter: markdown table

sections:
  show:
    - requirements
    - providers
    - modules
    - resources
    # Data sources are rendered into the resources table; without this the root module's
    # uptime_private_locations lookup is omitted entirely.
    - data-sources
    - inputs
    - outputs

content: |-
  {{ .Header }}

  {{ .Requirements }}

  {{ .Providers }}

  {{ .Modules }}

  {{ .Resources }}

  {{ .Inputs }}

  {{ .Outputs }}

output:
  file: README.md
  mode: inject

sort:
  enabled: false

settings:
  anchor: true
  color: true
  escape: true
  indent: 2
  required: true
  sensitive: true
  type: true
